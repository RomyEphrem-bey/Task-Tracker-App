<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Board</title>

    <style>
        :root {
            --page-background: #f3f6fb;
            --surface: rgba(255, 255, 255, 0.92);
            --surface-strong: #ffffff;
            --surface-muted: #eef3f9;
            --text-primary: #14213d;
            --text-secondary: #667085;
            --border: #dfe7f1;
            --border-strong: #cbd5e1;
            --brand: #5b5bd6;
            --brand-dark: #4747b8;
            --brand-soft: #eeeeff;
            --shadow: 0 20px 45px rgba(37, 52, 90, 0.14);
            --shadow-subtle: 0 8px 24px rgba(37, 52, 90, 0.08);
            --radius-large: 22px;
            --radius-medium: 16px;
            --radius-small: 11px;
            --priority-high: #c4320a;
            --priority-high-background: #fff1eb;
            --priority-medium: #b54708;
            --priority-medium-background: #fff8e8;
            --priority-low: #087a55;
            --priority-low-background: #eafaf3;
            --error: #b42318;
            --error-background: #fff1f0;
            --error-border: #f7c7c3;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 32px;
            color: var(--text-primary);
            background:
                radial-gradient(circle at top left, rgba(91, 91, 214, 0.12), transparent 30%),
                radial-gradient(circle at top right, rgba(74, 144, 226, 0.10), transparent 28%),
                var(--page-background);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .app-header {
            width: min(1240px, 100%);
            margin: 0 auto 30px;
            padding: 24px 26px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow: var(--shadow-subtle);
            backdrop-filter: blur(14px);
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .app-header h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
        }

        .app-header p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
        }

        main {
            width: min(1240px, 100%);
            margin: 0 auto;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
            align-items: start;
        }

        .column {
            min-width: 0;
            padding: 18px;
            background: rgba(238, 243, 249, 0.78);
            border: 1px solid rgba(203, 213, 225, 0.78);
            border-radius: var(--radius-large);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
        }

        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            padding: 0 2px;
        }

        .column-title {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 800;
            letter-spacing: 0.01em;
        }

        .column-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
            height: 30px;
            padding: 0 10px;
            color: var(--brand-dark);
            background: var(--brand-soft);
            border: 1px solid #dadaff;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 800;
        }

        .column-content {
            display: grid;
            gap: 14px;
            min-height: 150px;
        }

        .task-card {
            padding: 17px;
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: var(--radius-medium);
            box-shadow: var(--shadow-subtle);
            transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
        }

        .task-card:hover {
            transform: translateY(-3px);
            border-color: #c8d3e2;
            box-shadow: var(--shadow);
        }

        .task-card:active {
            cursor: grabbing;
        }

        .task-card h3 {
            margin: 0 0 9px;
            overflow-wrap: anywhere;
            font-size: 1rem;
            line-height: 1.45;
            letter-spacing: -0.01em;
        }

        .task-card p {
            margin: 0 0 14px;
            color: var(--text-secondary);
            overflow-wrap: anywhere;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .task-card p:last-child {
            margin-bottom: 0;
        }

        .task-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }

        .task-meta .edit-button {
            margin-left: auto;
        }

       .priority-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            padding: 0 16px;
            font-size: 0.875rem;
            font-weight: 700;
            border: 1px solid var(--border);
            border-radius: var(--radius-small);
        }

        .priority-high {
            color: var(--priority-high);
            background: var(--priority-high-background);
        }

        .priority-medium {
            color: var(--priority-medium);
            background: var(--priority-medium-background);
        }

        .priority-low {
            color: var(--priority-low);
            background: var(--priority-low-background);
        }

        .empty-state {
            display: grid;
            place-items: center;
            min-height: 150px;
            padding: 22px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.62);
            border: 1.5px dashed var(--border-strong);
            border-radius: var(--radius-medium);
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .error-card {
            grid-column: 1 / -1;
            padding: 18px;
            color: var(--error);
            background: var(--error-background);
            border: 1px solid var(--error-border);
            border-radius: var(--radius-medium);
            box-shadow: var(--shadow-subtle);
        }

        .error-card h2 {
            margin: 0 0 8px;
            font-size: 1rem;
        }

        .error-card p {
            margin: 0;
            line-height: 1.5;
        }

        .skeleton-card {
            min-height: 136px;
            padding: 17px;
            overflow: hidden;
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: var(--radius-medium);
            box-shadow: var(--shadow-subtle);
        }

        .skeleton-line {
            position: relative;
            height: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            background: #e7ecf3;
            border-radius: 999px;
        }

        .skeleton-line:last-child {
            margin-bottom: 0;
        }

        .skeleton-line::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
            transform: translateX(-100%);
            animation: skeleton-loading 1.4s infinite;
        }

        .skeleton-line.short { width: 42%; }
        .skeleton-line.medium { width: 68%; }
        .skeleton-line.long { width: 92%; }

        @keyframes skeleton-loading {
            100% { transform: translateX(100%); }
        }

        button {
            font: inherit;
        }

        .primary-button,
        .secondary-button,
        .icon-button,
        .edit-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            min-width: 58px;
            padding: 0 16px;
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-primary);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-small);
            cursor: pointer;
        }

        .primary-button {
            padding: 11px 17px;
            color: #ffffff;
            background: linear-gradient(135deg, var(--brand), #7373ea);
            border: 1px solid transparent;
            border-radius: var(--radius-small);
            box-shadow: 0 8px 18px rgba(91, 91, 214, 0.25);
            font-weight: 800;
        }

        .primary-button:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, var(--brand-dark), var(--brand));
            box-shadow: 0 11px 24px rgba(91, 91, 214, 0.3);
        }

        .primary-button:disabled {
            cursor: not-allowed;
            opacity: 0.62;
            transform: none;
        }

        #create-task-button {
            height: 46px;
            min-width: 160px;
            padding: 0 22px;
            background: #000000;
            border-color: #000000;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
        }

        #create-task-button:hover {
            background: #171717;
            border-color: #171717;
            box-shadow: 0 11px 24px rgba(0, 0, 0, 0.26);
        }

        .secondary-button,
        .edit-button {
            padding: 9px 13px;
            color: var(--text-primary);
            background: #ffffff;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-small);
            font-weight: 750;
        }

        .secondary-button:hover,
        .edit-button:hover {
            transform: translateY(-1px);
            border-color: #aab8cb;
            background: #f8fafc;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.56);
            backdrop-filter: blur(7px);
        }

        .modal-overlay[hidden] {
            display: none;
        }

        .modal {
            width: min(540px, 100%);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding: 26px;
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.26);
            animation: modal-in 180ms ease-out;
        }

        @keyframes modal-in {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header,
        .modal-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .modal-header {
            margin-bottom: 22px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.35rem;
            letter-spacing: -0.02em;
        }

        .icon-button {
            width: 36px;
            height: 36px;
            padding: 0;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            box-shadow: none;
            border-radius: 0;
            font-size: 2.5rem;
            line-height: 1;
            cursor: pointer;
        }

        .icon-button:hover {
            background: transparent;
            color: var(--text-primary);
        }

        .icon-button:focus-visible {
            outline: none;
        }

        .form-field {
            display: grid;
            gap: 8px;
            margin-bottom: 17px;
        }

        .form-field label {
            font-size: 0.88rem;
            font-weight: 800;
        }

        .form-field input,
        .form-field textarea,
        .form-field select {
            width: 100%;
            padding: 12px 13px;
            color: var(--text-primary);
            background: #fbfcfe;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-small);
            outline: none;
            font: inherit;
            transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        .form-field input:focus,
        .form-field textarea:focus,
        .form-field select:focus {
            background: #ffffff;
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(91, 91, 214, 0.12);
        }

        .form-field textarea {
            min-height: 112px;
            resize: vertical;
        }

        .form-field input[aria-invalid="true"] {
            border-color: var(--error);
            box-shadow: 0 0 0 4px rgba(180, 35, 24, 0.10);
        }

        .field-error,
        .server-error {
            color: var(--error);
            font-size: 0.84rem;
            line-height: 1.45;
        }

        .field-error:empty,
        .server-error:empty {
            display: none;
        }

        .server-error {
            margin: 0 0 16px;
            padding: 11px 13px;
            background: var(--error-background);
            border: 1px solid var(--error-border);
            border-radius: 12px;
        }

        .modal-actions {
            justify-content: flex-end;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }

        .modal-actions .primary-button,
        .modal-actions .secondary-button {
            width: 140px;
            height: 42px;
            padding: 0 16px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 900px) {
            body {
                padding: 28px 20px;
            }

            .board {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 18px 12px;
            }

            .app-header {
                padding: 20px;
                margin-bottom: 18px;
            }

            .header-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .primary-button {
                width: 100%;
            }

            .column {
                padding: 14px;
            }

            .modal {
                padding: 20px;
                border-radius: 18px;
            }

            .modal-actions {
                flex-direction: column-reverse;
            }

            .modal-actions .primary-button,
            .modal-actions .secondary-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="header-row">
            <div>
                <h1>Task Board</h1>
                <p>Drag tasks between columns to update their status.</p>
            </div>
            <button id="create-task-button" class="primary-button" type="button">Create New Task</button>
        </div>
    </header>

    <main>
        <section id="board" class="board" aria-live="polite"></section>
    </main>

    <div id="task-modal-overlay" class="modal-overlay" hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
            <div class="modal-header">
                <h2 id="task-modal-title">Create New Task</h2>
                <button id="close-task-modal" class="icon-button" type="button" aria-label="Close">&times;</button>
            </div>

            <form id="task-form" novalidate>
                <div class="form-field">
                    <label for="task-title">Title</label>
                    <input id="task-title" name="title" type="text" maxlength="200" />
                    <div id="title-error" class="field-error" aria-live="polite"></div>
                </div>

                <div class="form-field">
                    <label for="task-description">Description</label>
                    <textarea id="task-description" name="description"></textarea>
                </div>

                <div class="form-field">
                    <label for="task-status">Status</label>
                    <select id="task-status" name="status">
                        <option value="ToDo">To Do</option>
                        <option value="InProgress">In Progress</option>
                        <option value="Done">Done</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="task-priority">Priority</label>
                    <select id="task-priority" name="priority">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <div id="task-server-error" class="server-error" aria-live="polite"></div>

                <div class="modal-actions">
                    <button id="cancel-task-modal" class="secondary-button" type="button">Cancel</button>
                    <button class="primary-button" type="submit">Save</button>
                </div>
            </form>
        </section>
    </div>
<script>
    const API_BASE = "http://localhost:8000";
    const STATUSES = ["ToDo", "InProgress", "Done"];

    const STATUS_LABELS = {
        ToDo: "To Do",
        InProgress: "In Progress",
        Done: "Done"
    };

    const PRIORITY_ORDER = {
        High: 0,
        Medium: 1,
        Low: 2
    };

    const board = document.getElementById("board");
    const createTaskButton = document.getElementById("create-task-button");
    const modalOverlay = document.getElementById("task-modal-overlay");
    const modalTitle = document.getElementById("task-modal-title");
    const closeModalButton = document.getElementById("close-task-modal");
    const cancelModalButton = document.getElementById("cancel-task-modal");
    const taskForm = document.getElementById("task-form");
    const titleInput = document.getElementById("task-title");
    const descriptionInput = document.getElementById("task-description");
    const statusInput = document.getElementById("task-status");
    const priorityInput = document.getElementById("task-priority");
    const titleError = document.getElementById("title-error");
    const serverError = document.getElementById("task-server-error");

    let tasks = [];
    let draggedTaskId = null;
    let modalMode = "create";
    let editingTaskId = null;

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function showError(title, text) {
        let banner = document.getElementById("error-banner");

        if (!banner) {
            banner = document.createElement("div");
            banner.id = "error-banner";
            banner.className = "error-card";
            banner.style.display = "none";

            banner.innerHTML = `
                <h2 id="error-title"></h2>
                <p id="error-text"></p>
            `;

            board.parentElement.insertBefore(banner, board);
        }

        document.getElementById("error-title").textContent = title;
        document.getElementById("error-text").textContent = text;

        banner.style.display = "block";

        setTimeout(() => {
            banner.style.display = "none";
        }, 5000);
    }

    async function fetchTasks() {
        try {
            const response = await fetch(`${API_BASE}/tasks`);

            if (!response.ok) {
                throw new Error(`Failed to load tasks: HTTP ${response.status}`);
            }

            tasks = await response.json();
            renderBoard(tasks);
        } catch (error) {
            board.innerHTML = `
                <div class="error-card">
                    <h2>Unable to load tasks</h2>
                    <p>${escapeHtml(error.message)}</p>
                </div>
            `;
        }
    }

    function clearFormErrors() {
        titleError.textContent = "";
        serverError.textContent = "";
        titleInput.removeAttribute("aria-invalid");
    }

    function openCreateModal() {
        modalMode = "create";
        editingTaskId = null;
        modalTitle.textContent = "Create New Task";
        taskForm.reset();
        statusInput.value = "ToDo";
        priorityInput.value = "Medium";
        clearFormErrors();
        modalOverlay.hidden = false;
        titleInput.focus();
    }

    function openEditModal(task) {
        modalMode = "edit";
        editingTaskId = task.id;
        modalTitle.textContent = "Edit task";
        titleInput.value = task.title ?? "";
        descriptionInput.value = task.description ?? "";
        statusInput.value = task.status;
        priorityInput.value = task.priority;
        clearFormErrors();
        modalOverlay.hidden = false;
        titleInput.focus();
    }

    function closeTaskModal() {
        modalOverlay.hidden = true;
        taskForm.reset();
        clearFormErrors();
        modalMode = "create";
        editingTaskId = null;
    }

    function getServerErrorMessage(data, status) {
        if (Array.isArray(data?.detail)) {
            return data.detail.map((item) => item.msg).join(" ");
        }

        if (typeof data?.detail === "string") {
            return data.detail;
        }

        return `The server returned HTTP ${status}.`;
    }

    function renderBoard(tasksToRender) {
        board.innerHTML = "";

        STATUSES.forEach((status) => {
            const columnTasks = tasksToRender
                .filter((task) => task.status === status)
                .sort((a, b) => {
                    const priorityDifference =
                        PRIORITY_ORDER[a.priority] -
                        PRIORITY_ORDER[b.priority];

                    if (priorityDifference !== 0) {
                        return priorityDifference;
                    }

                    return String(a.id).localeCompare(String(b.id));
                });

            const column = document.createElement("section");

            column.className = "column";
            column.setAttribute("data-status", status);

            const cards = columnTasks.length
                ? columnTasks.map((task) => `
                    <article
                        class="task-card"
                        draggable="true"
                        data-id="${escapeHtml(task.id)}"
                    >
                        <h3>${escapeHtml(task.title)}</h3>
                        <p>${escapeHtml(task.description)}</p>

                        <div class="task-meta">
                            <span
                                class="priority-pill priority-${escapeHtml(
                                    String(task.priority).toLowerCase()
                                )}"
                            >
                                ${escapeHtml(task.priority)}
                            </span>

                            <button class="edit-button" type="button" data-action="edit">Edit</button>
                        </div>
                    </article>
                `).join("")
                : `<div class="empty-state">Drop tasks here</div>`;

            column.innerHTML = `
                <div class="column-header">
                    <h2 class="column-title">
                        ${STATUS_LABELS[status]}
                    </h2>

                    <span class="column-count">
                        ${columnTasks.length}
                    </span>
                </div>

                <div class="column-content">
                    ${cards}
                </div>
            `;

            board.appendChild(column);
        });
    }

    createTaskButton.addEventListener("click", openCreateModal);
    closeModalButton.addEventListener("click", closeTaskModal);
    cancelModalButton.addEventListener("click", closeTaskModal);

    modalOverlay.addEventListener("click", (event) => {
        if (event.target === modalOverlay) {
            closeTaskModal();
        }
    });

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !modalOverlay.hidden) {
            closeTaskModal();
        }
    });

    board.addEventListener("click", (event) => {
        const editButton = event.target.closest('[data-action="edit"]');

        if (!editButton) {
            return;
        }

        const card = editButton.closest(".task-card");
        const task = tasks.find((item) => String(item.id) === card?.dataset.id);

        if (task) {
            openEditModal(task);
        }
    });

    taskForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearFormErrors();

        const title = titleInput.value.trim();

        if (!title) {
            titleError.textContent = "Title is required and cannot be blank.";
            titleInput.setAttribute("aria-invalid", "true");
            titleInput.focus();
            return;
        }

        const payload = {
            title,
            description: descriptionInput.value,
            status: statusInput.value,
            priority: priorityInput.value,
            assignee: null
        };

        const isEdit = modalMode === "edit";
        const url = isEdit
            ? `${API_BASE}/tasks/${editingTaskId}`
            : `${API_BASE}/tasks`;

        try {
            const response = await fetch(url, {
                method: isEdit ? "PATCH" : "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                closeTaskModal();
                await fetchTasks();
                return;
            }

            let data = null;

            try {
                data = await response.json();
            } catch (error) {
                // Use the HTTP status fallback below.
            }

            serverError.textContent = getServerErrorMessage(data, response.status);
        } catch (error) {
            serverError.textContent = "A network error occurred. Please try again.";
        }
    });

    /*
     * Drag-and-drop uses event delegation on the board.
     * These handlers continue working after renderBoard()
     * replaces the cards and columns.
     */

    board.addEventListener("dragstart", (event) => {
        const card = event.target.closest(".task-card");

        if (!card) {
            return;
        }

        const id = card.getAttribute("data-id");

        if (!id) {
            return;
        }

        draggedTaskId = id;

        try {
            event.dataTransfer.setData("text/plain", id);
            event.dataTransfer.effectAllowed = "move";
        } catch (error) {
            // Ignore dataTransfer errors.
        }
    });

    board.addEventListener("dragover", (event) => {
        const column = event.target.closest(".column");

        if (!column) {
            return;
        }

        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
    });

    board.addEventListener("drop", async (event) => {
        const column = event.target.closest(".column");

        if (!column) {
            return;
        }

        event.preventDefault();

        const targetStatus = column.getAttribute("data-status");

        const transferredId =
            event.dataTransfer.getData("text/plain") ||
            draggedTaskId;

        if (!transferredId || !targetStatus) {
            return;
        }

        const task = tasks.find(
            (item) => String(item.id) === String(transferredId)
        );

        if (!task) {
            return;
        }

        const previousStatus = task.status;

        if (previousStatus === targetStatus) {
            return;
        }

        /*
         * Optimistically update the board before waiting
         * for the backend response.
         */
        task.status = targetStatus;
        renderBoard(tasks);

        try {
            const response = await fetch(
                `${API_BASE}/tasks/${task.id}`,
                {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        status: targetStatus
                    })
                }
            );

            if (response.ok) {
                return;
            }

            task.status = previousStatus;
            renderBoard(tasks);

            showError(
                "Unable to update task",
                `The server returned HTTP ${response.status}.`
            );
        } catch (error) {
            task.status = previousStatus;
            renderBoard(tasks);

            showError(
                "Unable to update task",
                "A network error occurred. Please try again."
            );
        }
    });

    fetchTasks();
</script>

</body>
</html>
